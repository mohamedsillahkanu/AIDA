<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4a6a">
<title>NMDR Use Caes</title>
<style>
  :root{
    --navy:#1f4a6a; --navy-deep:#163a55; --teal:#2a6f7a; --teal-soft:#e3f0f1;
    --bg:#f0f5f9; --paper:#ffffff; --line:#cfdbe6; --ink:#1b2733; --muted:#566879;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,Helvetica,sans-serif;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  .wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 20px}

  /* Header */
  .top{background:var(--navy);color:#fff;border-bottom:4px solid var(--teal);padding-top:env(safe-area-inset-top)}
  .top .wrap{display:flex;align-items:center;gap:18px;padding-top:26px;padding-bottom:28px}
  .top img{height:64px;width:auto;background:#fff;border-radius:8px;padding:4px;flex:0 0 auto}
  .brand h1{margin:0;font-size:44px;line-height:1;font-weight:800;letter-spacing:4px}
  .brand p{margin:8px 0 0;font-size:18px;font-weight:600;color:#d6e6f2}
  .brand small{display:block;margin-top:4px;font-size:14px;color:#9fc4d9}

  main{flex:1;padding:30px 0 40px}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .head h2{margin:0;font-size:22px;color:var(--navy)}
  .head span{color:var(--muted);font-size:14px}

  /* Cards: 4 columns desktop, 2 tablet, 1 phone */
  .grid{list-style:none;margin:0;padding:0;display:grid;gap:18px;grid-template-columns:repeat(4,minmax(0,1fr))}
  .card{height:100%;width:100%;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--navy);border-radius:10px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,74,106,.16)}
  .card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .num{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill.on{background:var(--teal-soft);color:var(--teal)}
  .pill.off{background:#edf1f5;color:var(--muted)}
  .card h3{margin:0;font-size:18px;line-height:1.3;color:var(--navy-deep)}
  .card p{margin:0;font-size:14.5px;color:var(--muted);flex:1}
  .card .go{margin-top:4px;padding-top:12px;border-top:1px solid var(--line);font-weight:700;font-size:14px;color:var(--teal);display:flex;align-items:center;justify-content:space-between}
  .card .go svg{width:20px;height:20px;transition:transform .15s ease}
  .card:hover .go svg{transform:translateX(4px)}

  .card.soon{border-top-color:#9db4c8;cursor:default}
  .card.soon:hover{transform:none;box-shadow:none}
  .card.soon .num{background:#9db4c8}
  .card.soon h3{color:var(--muted)}
  .card.soon .go{color:var(--muted)}

  /* Notice for use cases not yet configured */
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:calc(100% - 32px);text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  footer{border-top:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:13px;padding:14px 0 calc(14px + env(safe-area-inset-bottom))}

  /* Tablet: 2 columns */
  @media (max-width:1023px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .brand h1{font-size:38px}
  }
  /* Phone: 1 column */
  @media (max-width:639px){
    .wrap{padding:0 14px}
    .grid{grid-template-columns:1fr;gap:14px}
    .top .wrap{padding-top:18px;padding-bottom:20px;gap:12px}
    .top img{height:48px}
    .brand h1{font-size:32px;letter-spacing:3px}
    .brand p{font-size:15px}
    .brand small{font-size:12.5px}
    main{padding:22px 0 30px}
    .head h2{font-size:19px}
    .card{padding:16px}
    .card:hover{transform:none}
  }
  @media (prefers-reduced-motion:reduce){.card,.card .go svg,.toast{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <img src="mohlogo.png" alt="Ministry of Health Sierra Leone" onerror="this.remove()">
    <div class="brand">
      <h1>AIDA</h1>
      <p>Automated Intelligence for Decision Analytics</p>
      <small>Sierra Leone National Malaria Data Repository</small>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="head">
      <h2>Use Cases</h2>
      <span id="count"></span>
    </div>
    <ul class="grid" id="grid"></ul>
  </div>
</main>

<footer>
  <div class="wrap">National Malaria Control Programme, Ministry of Health, Sierra Leone.</div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   USE CASES: one entry per card.
   Put the page file in `url` to switch a card on.
   Leave `url` empty and the card shows as Coming soon.
   ============================================================ */
var USE_CASES = [
  { title: 'Monthly Reporting Completeness and Follow Up',
    desc:  'See which facilities and CHWs have reported, find the reporting gaps and follow them up until every report is in.',
    url:   'nmdr_use_case_1.html' },
  { title: 'Use Case 2', desc: 'This use case will be configured soon.', url: '' },
  { title: 'Use Case 3', desc: 'This use case will be configured soon.', url: '' },
  { title: 'Use Case 4', desc: 'This use case will be configured soon.', url: '' },
  { title: 'Use Case 5', desc: 'This use case will be configured soon.', url: '' },
  { title: 'Use Case 6', desc: 'This use case will be configured soon.', url: '' },
  { title: 'Use Case 7', desc: 'This use case will be configured soon.', url: '' },
  { title: 'Use Case 8', desc: 'This use case will be configured soon.', url: '' }
];

(function () {
  var grid = document.getElementById('grid');
  var toast = document.getElementById('toast');
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var timer;

  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function notify(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
  }

  var ready = 0;
  USE_CASES.forEach(function (uc, i) {
    var n = i + 1;
    var on = !!(uc.url && uc.url.trim());
    if (on) ready++;

    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card' + (on ? '' : ' soon');
    btn.setAttribute('aria-label', 'Use Case ' + n + ': ' + uc.title + (on ? '' : ', coming soon'));
    btn.innerHTML =
      '<div class="row"><span class="num" aria-hidden="true">' + n + '</span>' +
      '<span class="pill ' + (on ? 'on' : 'off') + '">' + (on ? 'Available' : 'Coming soon') + '</span></div>' +
      '<h3>' + esc(uc.title) + '</h3>' +
      '<p>' + esc(uc.desc) + '</p>' +
      '<span class="go">' + (on ? 'Open use case' : 'Not configured yet') + (on ? ARROW : '') + '</span>';

    btn.addEventListener('click', function () {
      if (on) location.href = uc.url;
      else notify('Use Case ' + n + ' is not configured yet.');
    });

    li.appendChild(btn);
    grid.appendChild(li);
  });

  document.getElementById('count').textContent = ready + ' of ' + USE_CASES.length + ' available';
})();
</script>
</body>
</html>
